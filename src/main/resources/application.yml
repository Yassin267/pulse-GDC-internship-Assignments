spring:
  application:
    name: registration-otp

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/registration}
    username: ${DATABASE_USERNAME:registration}
    password: ${DATABASE_PASSWORD:registration}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

server:
  port: 8080

logging:
  level:
    com.internship.registration: DEBUG

registration:
  pending-lifetime: 15m
  password-min-length: 8
  mail-from: ${MAIL_FROM:no-reply@registration.local}
  otp:
    length: 6
    lifetime: 5m
    max-attempts: 5
    resend-cooldown: 60s
    daily-send-limit: 10
    daily-send-window: 24h

# ---------------------------------------------------------------------
# Everything else is yours.
#
# There is no database, cache or mail configuration here yet, which is
# why the application starts cleanly with no services running.
#
# As you add dependencies you will need to add configuration for them.
# Two rules while you do:
#
#   1. Anything secret comes from an environment variable, never from
#      this file. The pattern looks like:  ${MAIL_PASSWORD}
#      See .env.example for the names.
#
#   2. Values from the brief (code lifetime, attempt limits, cooldowns)
#      belong in configuration too, not hard-coded in your classes.
#      Give them your own key names under a prefix you choose.
# ---------------------------------------------------------------------
